[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketiq"
version = "0.1.0"
description = "Support-ticket triage: intent, urgency, keyphrases, duplicate detection"
requires-python = ">=3.9"
dependencies = ["scikit-learn>=1.3", "numpy>=1.24", "pandas>=2.0", "joblib>=1.3"]

[project.scripts]
ticketiq = "ticketiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
